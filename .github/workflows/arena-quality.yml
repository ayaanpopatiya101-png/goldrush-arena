name: Arena quality
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
permissions:
  contents: read
jobs:
  contracts-and-types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/arena-contract.test.cjs
      - run: pnpm run test:launcher
      - run: pnpm run test:dependencies
      - run: pnpm --filter @workspace/mobile run test:reliability
      - run: pnpm typecheck
      - run: git diff --check
